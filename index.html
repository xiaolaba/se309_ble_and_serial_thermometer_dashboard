<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 針對 iPhone 11 及行動裝置優化 viewport 設定，禁止捲動與縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SE-309 4-Channel Thermometer Monitor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen w-screen overflow-hidden flex flex-col items-center justify-between p-2">

    <!-- 主容器：滿版填滿畫面，不產生捲動軸 -->
    <div class="w-full max-w-5xl h-full flex flex-col justify-between bg-slate-800 rounded-xl shadow-xl p-3 border border-slate-700">
        
        <!-- Header 區塊：精簡高度 -->
        <header class="flex flex-col pb-2 border-b border-slate-700 gap-2 flex-shrink-0">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-base sm:text-xl font-bold tracking-tight text-emerald-400 leading-tight">SE-309 Dashboard</h1>
                    <p class="text-[10px] sm:text-xs text-slate-400">BLE & Web Serial Monitor</p>
                </div>
                <button id="batteryStatusBtn" class="text-xs text-white font-medium px-2.5 py-1 rounded-lg transition shadow-md bg-emerald-600">
                    Battery OK
                </button>
            </div>

            <!-- 連線按鈕群組 -->
            <div class="grid grid-cols-2 gap-1.5">
                <!-- BLE Buttons -->
                <button id="connectBleBtn" class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-medium py-2 px-2 rounded-lg transition shadow flex items-center justify-center gap-1.5 text-xs">
                    Connect BLE
                </button>
                <button id="disconnectBleBtn" class="hidden bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 px-2 rounded-lg transition shadow flex items-center justify-center text-xs">
                    Stop BLE
                </button>

                <!-- Serial Buttons -->
                <button id="connectSerialBtn" class="bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-medium py-2 px-2 rounded-lg transition shadow flex items-center justify-center gap-1.5 text-xs">
                    Connect Serial
                </button>
                <button id="disconnectSerialBtn" class="hidden bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 px-2 rounded-lg transition shadow flex items-center justify-center text-xs">
                    Stop Serial
                </button>
            </div>
        </header>

        <!-- Channel Readout Cards: 2x2 網格，緊湊排版 -->
        <div class="grid grid-cols-2 gap-2 my-2 flex-shrink-0">
            <div id="cardT1" class="bg-slate-900/60 border border-slate-700 p-2 rounded-lg text-center transition">
                <span id="labelT1" class="text-xs uppercase tracking-wider text-amber-400 font-bold">T1</span>
                <div id="valT1" class="text-xl sm:text-2xl font-black mt-0.5">----</div>
            </div>
            <div id="cardT2" class="bg-slate-900/60 border border-slate-700 p-2 rounded-lg text-center transition">
                <span id="labelT2" class="text-xs uppercase tracking-wider text-rose-400 font-bold">T2</span>
                <div id="valT2" class="text-xl sm:text-2xl font-black mt-0.5">----</div>
            </div>
            <div id="cardT3" class="bg-slate-900/60 border border-slate-700 p-2 rounded-lg text-center transition">
                <span id="labelT3" class="text-xs uppercase tracking-wider text-emerald-400 font-bold">T3</span>
                <div id="valT3" class="text-xl sm:text-2xl font-black mt-0.5">----</div>
            </div>
            <div id="cardT4" class="bg-slate-900/60 border border-slate-700 p-2 rounded-lg text-center transition">
                <span id="labelT4" class="text-xs uppercase tracking-wider text-cyan-400 font-bold">T4</span>
                <div id="valT4" class="text-xl sm:text-2xl font-black mt-0.5">----</div>
            </div>
        </div>

        <!-- Chart Canvas Container: 依剩餘空間彈性縮放，確保不超出畫面 -->
        <div class="relative w-full flex-grow bg-slate-900/40 p-1.5 rounded-lg border border-slate-700 my-1 min-h-[140px]">
            <canvas id="tempChart"></canvas>
        </div>

        <!-- Hex Packet Log Panel: 精簡高度 -->
        <div class="mt-1 flex-shrink-0">
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Raw Packet Log</span>
                <button id="clearLogBtn" class="text-[10px] text-slate-400 hover:text-slate-200 underline py-0.5 px-1">Clear</button>
            </div>
            <div id="logBox" class="p-2 bg-slate-950 rounded-lg text-[10px] font-mono text-emerald-400 h-20 overflow-y-auto border border-slate-800 leading-tight">
                [System] Ready. Choose connection type...<br>
            </div>
        </div>
    </div>

    <script>
        // Protocol framing constants
        const STX = 0x02;
        const ETX = 0x03;
        const EXPECTED_PACKET_LENGTH = 45;

        // BLE Variables
        let bluetoothDevice = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;

        // Serial Variables
        let serialPort = null;
        let serialReader = null;
        let keepReadingSerial = false;

        let pollTimer = null;
        let tempChart = null;
        let streamBuffer = [];

        // UI Elements
        const connectBleBtn = document.getElementById('connectBleBtn');
        const disconnectBleBtn = document.getElementById('disconnectBleBtn');
        const connectSerialBtn = document.getElementById('connectSerialBtn');
        const disconnectSerialBtn = document.getElementById('disconnectSerialBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');
        const logBox = document.getElementById('logBox');
        const batteryStatusBtn = document.getElementById('batteryStatusBtn');

        const valT1 = document.getElementById('valT1');
        const valT2 = document.getElementById('valT2');
        const valT3 = document.getElementById('valT3');
        const valT4 = document.getElementById('valT4');

        function log(msg, isHex = false) {
            const time = new Date().toLocaleTimeString();
            const colorClass = isHex ? 'text-amber-300 font-mono' : 'text-slate-400';
            const cleanMsg = String(msg).replace(/\\n/g, '\n');
            const formattedMsg = cleanMsg.replace(/\n/g, '<br>&nbsp;&nbsp;');
            
            logBox.innerHTML += `<div class="py-0.2"><span class="text-slate-600">[${time}]</span> <span class="${colorClass}">${formattedMsg}</span></div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        clearLogBtn.addEventListener('click', () => {
            logBox.innerHTML = '';
        });

        function initChart() {
            if (typeof Chart === 'undefined') {
                setTimeout(initChart, 500);
                return;
            }

            const ctx = document.getElementById('tempChart').getContext('2d');
            tempChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'T1', borderColor: '#fbbf24', data: [], borderWidth: 1.5, pointRadius: 0, tension: 0.1 },
                        { label: 'T2', borderColor: '#fb7185', data: [], borderWidth: 1.5, pointRadius: 0, tension: 0.1 },
                        { label: 'T3', borderColor: '#34d399', data: [], borderWidth: 1.5, pointRadius: 0, tension: 0.1 },
                        { label: 'T4', borderColor: '#22d3ee', data: [], borderWidth: 1.5, pointRadius: 0, tension: 0.1 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 }, maxTicksLimit: 6 } },
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 } } }
                    },
                    plugins: { legend: { labels: { color: '#f1f5f9', boxWidth: 10, font: { size: 10 } } } }
                }
            });
        }

        window.addEventListener('load', () => {
            initChart();
        });

        // ==================== BLUETOOTH (BLE) LOGIC ====================
        connectBleBtn.addEventListener('click', async () => {
            try {
                log('Requesting Bluetooth Device...');
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
                        '0000ffe0-0000-1000-8000-00805f9b34fb'
                    ]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onBleDisconnected);

                log(`Connecting to ${bluetoothDevice.name || 'SE-309'}...`);
                const server = await bluetoothDevice.gatt.connect();
                
                const services = await server.getPrimaryServices();
                for (let service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (let char of characteristics) {
                        if (char.properties.write || char.properties.writeWithoutResponse) txCharacteristic = char;
                        if (char.properties.notify || char.properties.indicate) rxCharacteristic = char;
                    }
                }

                if (!rxCharacteristic || !txCharacteristic) {
                    const uartService = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e').catch(() => null);
                    if (uartService) {
                        txCharacteristic = await uartService.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                        rxCharacteristic = await uartService.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
                    }
                }

                if (!rxCharacteristic || !txCharacteristic) {
                    throw new Error('UART characteristics not found.');
                }

                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    processIncomingBytes(new Uint8Array(event.target.value.buffer));
                });

                log('BLE Connected!');
                connectBleBtn.classList.add('hidden');
                connectSerialBtn.classList.add('hidden');
                disconnectBleBtn.classList.remove('hidden');

                pollTimer = setInterval(sendBleReadCommand, 500);

            } catch (error) {
                log(`BLE Error: ${error}`);
            }
        });

        disconnectBleBtn.addEventListener('click', () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            onBleDisconnected();
        });

        function onBleDisconnected() {
            log('BLE disconnected.');
            if (pollTimer) clearInterval(pollTimer);
            connectBleBtn.classList.remove('hidden');
            connectSerialBtn.classList.remove('hidden');
            disconnectBleBtn.classList.add('hidden');
            streamBuffer = [];
        }

        async function sendBleReadCommand() {
            if (!txCharacteristic) return;
            try {
                await txCharacteristic.writeValueWithoutResponse(new TextEncoder().encode('A'));
            } catch (err) {}
        }

        // ==================== WEB SERIAL LOGIC ====================
        connectSerialBtn.addEventListener('click', async () => {
            if (!('serial' in navigator)) {
                alert('Web Serial is not supported in this browser.');
                return;
            }

            try {
                log('Requesting Serial Port...');
                serialPort = await navigator.serial.requestPort();
                await serialPort.open({ baudRate: 9600 });
                log('Serial opened.');

                connectBleBtn.classList.add('hidden');
                connectSerialBtn.classList.add('hidden');
                disconnectSerialBtn.classList.remove('hidden');

                keepReadingSerial = true;
                readSerialLoop();

                pollTimer = setInterval(sendSerialReadCommand, 500);

            } catch (error) {
                log(`Serial Error: ${error}`);
            }
        });

        disconnectSerialBtn.addEventListener('click', async () => {
            keepReadingSerial = false;
            if (pollTimer) clearInterval(pollTimer);
            if (serialReader) {
                try { await serialReader.cancel(); } catch (e) {}
                serialReader = null;
            }
            if (serialPort) {
                try { await serialPort.close(); } catch (e) {}
                serialPort = null;
            }
            onSerialDisconnected();
        });

        function onSerialDisconnected() {
            log('Serial closed.');
            connectBleBtn.classList.remove('hidden');
            connectSerialBtn.classList.remove('hidden');
            disconnectSerialBtn.classList.add('hidden');
            streamBuffer = [];
        }

        async function sendSerialReadCommand() {
            if (!serialPort || !serialPort.writable) return;
            try {
                const writer = serialPort.writable.getWriter();
                await writer.write(new TextEncoder().encode('A'));
                writer.releaseLock();
            } catch (err) {}
        }

        async function readSerialLoop() {
            while (serialPort && serialPort.readable && keepReadingSerial) {
                serialReader = serialPort.readable.getReader();
                try {
                    while (true) {
                        const { value, done } = await serialReader.read();
                        if (done) break;
                        if (value) processIncomingBytes(value);
                    }
                } catch (error) {
                } finally {
                    serialReader.releaseLock();
                }
            }
        }

        // ==================== COMMON PACKET PARSER ====================
        function processIncomingBytes(chunk) {
            for (let i = 0; i < chunk.length; i++) {
                streamBuffer.push(chunk[i]);
            }

            while (true) {
                const stxIndex = streamBuffer.indexOf(STX);
                if (stxIndex === -1) {
                    if (streamBuffer.length > 512) streamBuffer = [];
                    break;
                }

                if (stxIndex > 0) streamBuffer.splice(0, stxIndex);
                if (streamBuffer.length < EXPECTED_PACKET_LENGTH) break;

                if (streamBuffer[EXPECTED_PACKET_LENGTH - 1] === ETX) {
                    const frameBytes = streamBuffer.slice(0, EXPECTED_PACKET_LENGTH);
                    streamBuffer.splice(0, EXPECTED_PACKET_LENGTH);
                    parseAndPlotSE309Packet(new Uint8Array(frameBytes));
                } else {
                    streamBuffer.splice(0, 1);
                }
            }
        }

        function parseAndPlotSE309Packet(packet) {
            try {
                const isCelsius = (packet[1] & 0x80) !== 0;
                const unit = isCelsius ? '°C' : '°F';
                const lowBatteryFlag = (packet[1] & 0x40) !== 0;
                
                batteryStatusBtn.innerText = lowBatteryFlag ? 'Low Batt' : 'Battery OK';
                batteryStatusBtn.className = "text-xs text-white font-medium px-2.5 py-1 rounded-lg transition shadow-md " + 
                    (lowBatteryFlag ? 'bg-rose-600' : 'bg-emerald-600');

                const rawT1 = (packet[7] << 8) + packet[8];
                const rawT2 = (packet[9] << 8) + packet[10];
                const rawT3 = (packet[11] << 8) + packet[12];
                const rawT4 = (packet[13] << 8) + packet[14];

                const toSigned16 = (val) => (val & 0x8000) ? val - 0x10000 : val;

                let t1 = toSigned16(rawT1) / 10.0;
                let t2 = toSigned16(rawT2) / 10.0;
                let t3 = toSigned16(rawT3) / 10.0;
                let t4 = toSigned16(rawT4) / 10.0;

                const overloadByte = packet[39];
                let isT1Overload = (overloadByte === 1 || (overloadByte & 0x01)) || rawT1 === 0x7FFF || rawT1 === 0x8000;
                let isT2Overload = (overloadByte === 2 || (overloadByte & 0x02)) || rawT2 === 0x7FFF || rawT2 === 0x7FFF;
                let isT3Overload = (overloadByte === 3 || (overloadByte & 0x04)) || rawT3 === 0x7FFF || rawT3 === 0x8000;
                let isT4Overload = (overloadByte === 4 || (overloadByte & 0x08)) || rawT4 === 0x7FFF || rawT4 === 0x8000;

                valT1.innerText = isT1Overload ? "-" : t1.toFixed(1) + " " + unit;
                valT2.innerText = isT2Overload ? "-" : t2.toFixed(1) + " " + unit;
                valT3.innerText = isT3Overload ? "-" : t3.toFixed(1) + " " + unit;
                valT4.innerText = isT4Overload ? "-" : t4.toFixed(1) + " " + unit;

                if (tempChart) {
                    const timeLabel = new Date().toLocaleTimeString();
                    if (tempChart.data.labels.length > 30) {
                        tempChart.data.labels.shift();
                        tempChart.data.datasets.forEach(dataset => dataset.data.shift());
                    }

                    tempChart.data.labels.push(timeLabel);
                    tempChart.data.datasets[0].data.push(isT1Overload ? null : t1);
                    tempChart.data.datasets[1].data.push(isT2Overload ? null : t2);
                    tempChart.data.datasets[2].data.push(isT3Overload ? null : t3);
                    tempChart.data.datasets[3].data.push(isT4Overload ? null : t4);
                    tempChart.update('none');
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
